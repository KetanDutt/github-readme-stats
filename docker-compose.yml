services:
  github-readme-stats:
    build: .
    image: github-readme-stats:local
    container_name: github-readme-stats
    restart: unless-stopped
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
